name: Buzhi Island core flow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run every core regression and report all failures
        shell: bash
        run: |
          export CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          status=0
          for test in tests/quiz-flow.cjs tests/task-writings.cjs tests/loading-flow.cjs tests/loading-browser.cjs tests/office-memorial.cjs tests/recovery-flow.cjs tests/maintenance-relations.mjs tests/deployment-artifact.mjs tests/flow.mjs tests/online-flow.mjs tests/activity-flow.mjs tests/activity-admin.cjs tests/operations-flow.mjs tests/backup-disconnect.mjs tests/operations-admin.cjs tests/content-flow.mjs tests/content-admin.cjs tests/admin-pages.cjs tests/membership-flow.mjs tests/membership-admin.cjs tests/membership-race.cjs tests/message-board-flow.mjs tests/maintenance-flow.mjs tests/maintenance-admin.cjs tests/site-acceptance.cjs tests/production-layout.cjs; do
            echo "::group::$test"
            if timeout --kill-after=5s 120s node "$test"; then
              echo "PASS $test"
            else
              echo "::error::FAIL $test"
              status=1
            fi
            echo "::endgroup::"
          done
          if timeout --kill-after=5s 120s node tests/ui-preview-draw.cjs --office-only; then
            echo "PASS preview office layout and progress"
          else
            echo "::error::FAIL preview office layout and progress"
            status=1
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-memorial-preview
          path: test-results/*.png
          if-no-files-found: ignore
  visual-sync:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      - name: Verify hand-drawn interactions and actual per-page glass
        shell: pwsh
        run: |
          $env:CHROMIUM_PATH='C:/Program Files/Google/Chrome/Application/chrome.exe'
          $taskStatus=0
          node tests/pencil-assets.mjs
          if ($LASTEXITCODE -ne 0) { $taskStatus=1 }
          node tests/pencil-case.cjs --features-only
          if ($LASTEXITCODE -ne 0) { $taskStatus=1 }
          $env:LIQUID_EVIDENCE_DIR='test-results/site-pages'
          node tests/liquid-page-evidence.cjs
          if ($LASTEXITCODE -ne 0) { $taskStatus=1 }
          exit $taskStatus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-site-visual-evidence
          path: test-results/site-pages
          if-no-files-found: ignore
  windows-routes:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node tests/loading-flow.cjs
      - run: node tests/loading-browser.cjs
      - run: node tests/deployment-artifact.mjs
      - run: node tests/recovery-flow.cjs
