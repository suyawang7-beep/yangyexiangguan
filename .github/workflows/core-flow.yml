name: Buzhi Island core flow
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/deployment-artifact.mjs
      - run: node tests/pencil-assets.mjs
      - run: CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/pencil-case.cjs
      - run: node tests/flow.mjs
      - run: node tests/online-flow.mjs
      - run: node tests/activity-flow.mjs
      - run: node tests/activity-admin.cjs
      - run: node tests/operations-flow.mjs
      - run: node tests/backup-disconnect.mjs
      - run: node tests/operations-admin.cjs
      - run: node tests/content-flow.mjs
      - run: node tests/content-admin.cjs
      - run: node tests/admin-pages.cjs
      - run: node tests/membership-flow.mjs
      - run: node tests/membership-admin.cjs
      - run: node tests/membership-race.cjs
      - run: node tests/message-board-flow.mjs
      - run: node tests/maintenance-flow.mjs
      - run: node tests/maintenance-admin.cjs
      - run: node tests/site-acceptance.cjs
      - run: CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/production-layout.cjs


