name: Island hand-drawn UI and glass
on:
  push:
    branches: [main]
    paths:
      - 'ui-preview/**'
      - 'server/index.mjs'
      - 'tests/pencil-*'
      - 'tests/liquid-page-evidence.cjs'
      - '.github/workflows/pencil-ui.yml'
  pull_request:
    branches: [main]
    paths: ['ui-preview/**', 'server/index.mjs', 'tests/pencil-*', 'tests/liquid-page-evidence.cjs', '.github/workflows/pencil-ui.yml']
  workflow_dispatch:
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CHROMIUM_PATH: C:/Program Files/Google/Chrome/Application/chrome.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      # Use system Chrome with H.264 playback support; keep real playback assertions.
      - run: node tests/pencil-assets.mjs
      - run: node tests/pencil-case.cjs
      - shell: pwsh
        run: |
          $env:LIQUID_EVIDENCE_DIR="$env:RUNNER_TEMP/liquid-evidence"
          node tests/liquid-page-evidence.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computed-liquid-page-evidence
          path: ${{ runner.temp }}/liquid-evidence
